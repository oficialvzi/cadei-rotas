<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <title>Logo Cadei-Rotas</title>
  <desc>Logo horizontal principal do aplicativo Cadei-Rotas</desc>

  <!-- Símbolo: pin com roda + linha de rota -->
  <g transform="translate(40, 30)">
    <!-- Pin de localização -->
    <path d="M 50 0 C 22 0, 0 22, 0 50 C 0 80, 25 110, 50 140 C 75 110, 100 80, 100 50 C 100 22, 78 0, 50 0 Z" fill="#0E5FB5"/>

    <!-- Linha de rota: começa na ponta inferior do pin (50, 140) e sobe em direção à direita -->
    <path d="M 50 140 Q 110 130, 150 100 T 210 60"
          fill="none"
          stroke="#0F6E56"
          stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="2 6"/>
    <!-- Ponto final da rota -->
    <circle cx="213" cy="60" r="6" fill="#0F6E56"/>

    <!-- Roda interna -->
    <circle cx="50" cy="50" r="32" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="32" fill="none" stroke="#0E5FB5" stroke-width="3"/>

    <!-- Raios -->
    <line x1="50" y1="22" x2="50" y2="78" stroke="#0E5FB5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="50" x2="78" y2="50" stroke="#0E5FB5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="70" y2="70" stroke="#0E5FB5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="70" y1="30" x2="30" y2="70" stroke="#0E5FB5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cubo central -->
    <circle cx="50" cy="50" r="6" fill="#0E5FB5"/>
  </g>

  <!-- Wordmark -->
  <text x="270" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="500" fill="#0E5FB5">Cadei</text>
  <text x="396" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="500" fill="#bfbfbf">-</text>
  <text x="418" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="500" fill="#0F6E56">Rotas</text>
  <text x="278" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#bfbfbf" letter-spacing="2">ACESSIBILIDADE EM ROTA</text>
</svg>
