<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <title>Ícone Cadei-Rotas</title>
    <desc>Ícone do app para launcher Android e iOS</desc>

    <!-- Pin branco -->
    <g transform="translate(126, 96)">
        <path d="M 130 0 C 58 0, 0 58, 0 130 C 0 208, 65 286, 130 338 C 195 286, 260 208, 260 130 C 260 58, 202 0, 130 0 Z" fill="#0E5FB5"/>

        <!-- Roda azul interna -->
        <circle cx="130" cy="130" r="73" fill="#FFFFFF" />
        <circle cx="130" cy="130" r="73" fill="none" stroke="#0E5FB5" stroke-width="8"/>

        <!-- Raios -->
        <line x1="130" y1="68" x2="130" y2="192" stroke="#0E5FB5" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="68" y1="130" x2="192" y2="130" stroke="#0E5FB5" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="84" y1="84" x2="176" y2="176" stroke="#0E5FB5" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="176" y1="84" x2="84" y2="176" stroke="#0E5FB5" stroke-width="6.5" stroke-linecap="round"/>

        <!-- Cubo central -->
        <circle cx="130" cy="130" r="13" fill="#0E5FB5"/>
    </g>
</svg>
